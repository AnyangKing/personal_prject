<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperVocab — 논문 단어장</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --base:     #1e1e2e;  --mantle:   #181825;  --crust:    #11111b;
  --surface0: #313244;  --surface1: #45475a;  --surface2: #585b70;
  --overlay0: #6c7086;  --text:     #cdd6f4;  --subtext0: #a6adc8;
  --blue:     #89b4fa;  --green:    #a6e3a1;  --yellow:   #f9e2af;
  --red:      #f38ba8;  --mauve:    #cba6f7;  --teal:     #94e2d5;
  --peach:    #fab387;  --pink:     #f5c2e7;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--base); color: var(--text);
  font-family: 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif;
  font-size: 14px; display: flex; flex-direction: column;
}

/* ══ Header ══ */
#header {
  background: var(--mantle); border-bottom: 1px solid var(--surface1);
  padding: 0 12px; display: flex; align-items: center; gap: 8px;
  flex-shrink: 0; height: 48px;
}
#logo { font-size: 15px; font-weight: 700; color: var(--blue); white-space: nowrap; }
.hbtn {
  background: none; border: none; color: var(--subtext0); cursor: pointer;
  font-size: 15px; padding: 5px 7px; border-radius: 5px; transition: all .15s;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.hbtn:hover { background: var(--surface0); color: var(--text); }
#upload-btn {
  background: var(--blue); color: var(--base); border: none; border-radius: 6px;
  padding: 6px 14px; font-weight: 600; cursor: pointer; font-size: 13px;
  white-space: nowrap; transition: opacity .2s; flex-shrink: 0;
}
#upload-btn:hover { opacity: .82; }
#paper-title {
  color: var(--subtext0); font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
}
#ai-badge {
  display: none; background: linear-gradient(135deg,var(--mauve),var(--blue));
  color: var(--base); border-radius: 12px; padding: 2px 9px;
  font-size: 10px; font-weight: 700; letter-spacing: .3px; white-space: nowrap;
}
#ai-badge.visible { display: block; }
#view-toggle-group { display: flex; gap: 3px; flex-shrink: 0; }
.vbtn {
  background: var(--surface0); border: 1px solid var(--surface1); color: var(--subtext0);
  border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer; transition: all .15s;
}
.vbtn.active { background: var(--blue); color: var(--base); border-color: var(--blue); font-weight: 600; }
#page-controls { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.page-btn {
  background: var(--surface0); border: none; color: var(--text); border-radius: 4px;
  width: 28px; height: 28px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: background .15s;
}
.page-btn:hover { background: var(--surface1); }
.page-btn:disabled { opacity: .3; cursor: not-allowed; }
#page-info { color: var(--subtext0); font-size: 13px; min-width: 56px; text-align: center; }

/* ══ Main Layout ══ */
#main { display: flex; flex: 1; overflow: hidden; min-height: 0; }
.panel { flex: 1; overflow: auto; position: relative; min-width: 0; }

/* ── Vocab Sidebar ── */
#vocab-section {
  background: var(--mantle); border-right: 1px solid var(--surface1);
  flex-shrink: 0; display: flex; flex-direction: column;
  width: 270px; transition: width .25s ease; overflow: hidden; min-height: 0;
}
#vocab-section.collapsed { width: 0; }
#vocab-header {
  display: flex; align-items: center; gap: 5px;
  padding: 0 10px; height: 38px; flex-shrink: 0;
  border-bottom: 1px solid var(--surface0);
}
#vocab-title { font-weight: 600; font-size: 13px; flex: 1; white-space: nowrap; }
#vocab-count {
  background: var(--surface0); color: var(--subtext0);
  border-radius: 10px; padding: 1px 7px; font-size: 10px; white-space: nowrap;
}
#vocab-toggle, .vs-btn {
  background: none; border: none; color: var(--subtext0);
  cursor: pointer; font-size: 12px; padding: 3px 5px;
  border-radius: 4px; transition: all .15s; flex-shrink: 0;
}
#vocab-toggle:hover, .vs-btn:hover { color: var(--text); background: var(--surface0); }
#vocab-search-row { padding: 6px 10px; flex-shrink: 0; border-bottom: 1px solid var(--surface0); }
#vocab-search {
  width: 100%; background: var(--surface0); border: 1px solid var(--surface1);
  color: var(--text); border-radius: 5px; padding: 4px 8px; font-size: 12px; outline: none;
}
#vocab-search:focus { border-color: var(--blue); }
#vocab-filter-btns {
  display: flex; gap: 3px; padding: 5px 10px; flex-wrap: wrap;
  border-bottom: 1px solid var(--surface0); flex-shrink: 0;
}
.fbtn {
  background: var(--surface0); border: 1px solid transparent; color: var(--subtext0);
  border-radius: 4px; padding: 2px 7px; font-size: 10px; cursor: pointer; transition: all .15s;
}
.fbtn.active { background: var(--mauve); color: var(--base); font-weight: 600; }
.fbtn:hover:not(.active) { background: var(--surface1); color: var(--text); }
#vocab-col-header {
  display: flex; align-items: center; padding: 0 10px; height: 22px; flex-shrink: 0;
  border-bottom: 1px solid var(--surface0);
  font-size: 10px; color: var(--overlay0); letter-spacing: .4px; text-transform: uppercase; user-select: none;
}
#vocab-content { overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; flex: 1; }
#vocab-content::-webkit-scrollbar { width: 4px; }
#vocab-content::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 2px; }

/* Sidebar resize + toggle tab */
#sidebar-divider {
  width: 4px; background: var(--surface0); cursor: col-resize; flex-shrink: 0; transition: background .2s;
  position: relative;
}
#sidebar-divider:hover, #sidebar-divider.dragging { background: var(--blue); }

#sidebar-toggle-tab {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 20px; height: 48px;
  background: var(--surface1); border: 1px solid var(--surface2);
  border-radius: 0 6px 6px 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 10px; color: var(--subtext0);
  transition: background .15s, color .15s;
  z-index: 10; user-select: none;
}
#sidebar-toggle-tab:hover { background: var(--blue); color: var(--base); border-color: var(--blue); }

/* Word rows */
.word-row {
  display: flex; align-items: center; padding: 0 10px; height: 28px; flex-shrink: 0;
  transition: background .1s; cursor: pointer;
}
.word-row:hover { background: var(--surface0); }
.word-row.selected { background: rgba(137,180,250,.16) !important; }
.word-row.known-row { opacity: .38; }
.word-row.known-row:hover { opacity: .7; background: var(--surface0); }
.wr-indicator {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-right: 8px;
}
.wr-indicator.new      { background: var(--blue); }
.wr-indicator.repeated { background: var(--yellow); }
.wr-indicator.known    { background: var(--surface2); }
.wr-word { font-size: 12px; font-weight: 600; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.word-row.repeated-row .wr-word { color: var(--yellow); }
.word-row.known-row    .wr-word { color: var(--overlay0); }
.wr-korean { font-size: 11px; color: var(--teal); width: 68px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 4px; }
.wr-freq   { font-size: 10px; color: var(--overlay0); width: 28px; flex-shrink: 0; text-align: right; margin-left: 2px; }
.wr-know-btn {
  flex-shrink: 0; background: transparent; border: none; color: var(--overlay0);
  border-radius: 3px; width: 16px; padding: 0; font-size: 12px; cursor: pointer;
  line-height: 1; transition: color .15s; opacity: 0; margin-left: 2px;
}
.word-row:hover .wr-know-btn { opacity: 1; }
.wr-know-btn:hover { color: var(--green); }
.wr-know-btn.known { opacity: 1; color: var(--green); }
.wr-know-btn.known:hover { color: var(--red); }
.wr-loading .wr-korean { color: var(--overlay0); animation: pulse 1.5s infinite; }

/* ── Word Detail Panel ── */
#word-detail {
  border-top: 1px solid var(--surface0); background: var(--crust);
  padding: 12px; min-height: 190px; max-height: 38%;
  overflow-y: auto; flex-shrink: 0;
}
.word-detail-empty {
  color: var(--overlay0); font-size: 12px; line-height: 1.6; text-align: center;
  display: flex; align-items: center; justify-content: center; height: 100%; min-height: 100px;
}
.detail-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.detail-word-en { font-size: 20px; font-weight: 700; color: var(--blue); }
.detail-pos { font-size: 10px; color: var(--overlay0); font-style: italic; }
.detail-tts {
  margin-left: auto; background: none; border: none; color: var(--subtext0);
  cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 4px; transition: all .15s;
}
.detail-tts:hover { color: var(--blue); background: var(--surface0); }
.detail-know-btn {
  background: var(--surface0); border: 1px solid var(--surface1); color: var(--subtext0);
  border-radius: 5px; padding: 2px 8px; font-size: 10px; cursor: pointer; transition: all .15s;
}
.detail-know-btn:hover { background: var(--green); color: var(--base); border-color: var(--green); }
.detail-know-btn.known { background: var(--green); color: var(--base); border-color: var(--green); }
.detail-know-btn.known:hover { background: var(--red); border-color: var(--red); }
.detail-korean { color: var(--teal); font-size: 14px; font-weight: 600; margin: 4px 0 6px; }
.detail-definition {
  color: var(--text); font-size: 12px; line-height: 1.6;
  padding: 8px 10px; background: var(--surface0); border-radius: 6px; margin-bottom: 8px;
}
.detail-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.detail-chip {
  background: var(--surface0); color: var(--subtext0);
  border-radius: 999px; padding: 2px 8px; font-size: 10px;
}
.detail-section-title {
  color: var(--overlay0); font-size: 10px; text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 4px;
}
.detail-example { color: var(--subtext0); font-size: 11px; line-height: 1.6; margin-bottom: 8px; }
.detail-example em { color: var(--yellow); font-style: normal; font-weight: 600; }

/* ── PDF Panel ── */
#left-panel {
  border-right: 1px solid var(--surface1); background: var(--crust);
  display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 8px;
}
#pdf-canvas { box-shadow: 0 4px 24px rgba(0,0,0,.45); max-width: 100%; display: block; }

/* ── Translation Panel ── */
#right-panel { background: var(--base); padding: 22px 28px; }
#right-panel #translation-content { max-width: 740px; }
.trans-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
  border-bottom: 1px solid var(--surface0); padding-bottom: 8px;
}
.trans-header-label { font-size: 10px; color: var(--overlay0); letter-spacing: .8px; text-transform: uppercase; flex: 1; }
.trans-engine-tag {
  font-size: 10px; border-radius: 10px; padding: 1px 7px; font-weight: 600;
}
.trans-engine-tag.claude { background: rgba(203,166,247,.18); color: var(--mauve); }
.trans-engine-tag.mymemory { background: rgba(137,180,250,.12); color: var(--blue); }

/* ── Translation view ── */
.trans-p {
  margin: 0 0 1.5em;
  font-size: 15px; line-height: 2.15; word-break: keep-all;
  color: var(--text); text-indent: 1.5em;
  font-family: 'Noto Sans KR', system-ui, sans-serif;
}
.trans-p:first-of-type { text-indent: 0; }
.trans-hdr {
  font-size: 14px; font-weight: 700; color: var(--blue);
  margin: 2em 0 0.6em; letter-spacing: .3px; text-indent: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
.trans-mymemory-note {
  font-size: 11px; color: var(--overlay0); margin-bottom: 18px;
  padding: 5px 10px; background: var(--surface0); border-radius: 5px;
}
.trans-loading { color: var(--overlay0); padding: 24px 0; display: flex; align-items: center; gap: 10px; }

/* ── Paper folder tree ── */
.paper-folder { border-bottom: 1px solid var(--surface0); }
.paper-folder-hdr {
  display: flex; align-items: center; gap: 5px;
  padding: 0 10px; height: 34px; cursor: pointer;
  background: rgba(255,255,255,.02); transition: background .12s;
  user-select: none; flex-shrink: 0;
}
.paper-folder-hdr:hover { background: var(--surface0); }
.folder-arrow {
  font-size: 8px; color: var(--overlay0); transition: transform .15s; flex-shrink: 0;
}
.folder-arrow.open { transform: rotate(90deg); }
.folder-title {
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 12px; color: var(--subtext0);
}
.folder-count {
  font-size: 10px; color: var(--overlay0);
  background: var(--surface0); border-radius: 10px; padding: 1px 6px; flex-shrink: 0;
}
.paper-folder-content { border-top: 1px solid var(--surface0); }
.paper-folder-content .word-row { padding-left: 20px; }

/* ── Main divider ── */
#divider { width: 5px; background: var(--surface0); cursor: col-resize; flex-shrink: 0; transition: background .2s; }
#divider:hover, #divider.dragging { background: var(--blue); }

/* ── Empty states ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 12px; color: var(--overlay0);
}
.empty-state .icon { font-size: 52px; }

/* ── Settings Modal ── */
#settings-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
  z-index: 300; align-items: center; justify-content: center;
}
#settings-overlay.open { display: flex; }
#settings-panel {
  background: var(--mantle); border: 1px solid var(--surface1); border-radius: 14px;
  padding: 28px; width: 500px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
  z-index: 301;
}
#settings-panel h2 { font-size: 16px; color: var(--text); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
.setting-group { margin-bottom: 18px; }
.setting-group label { display: block; font-size: 12px; color: var(--subtext0); margin-bottom: 6px; font-weight: 600; letter-spacing: .3px; }
.setting-input {
  width: 100%; background: var(--surface0); border: 1px solid var(--surface1);
  color: var(--text); border-radius: 7px; padding: 8px 12px; font-size: 13px; outline: none;
}
.setting-input:focus { border-color: var(--blue); }
select.setting-input { cursor: pointer; }
.setting-hint { font-size: 11px; color: var(--overlay0); margin-top: 5px; line-height: 1.5; }
.setting-hint a { color: var(--blue); }
.setting-divider { border: none; border-top: 1px solid var(--surface0); margin: 20px 0; }
.settings-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn-primary {
  background: var(--blue); color: var(--base); border: none; border-radius: 7px;
  padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .2s;
}
.btn-primary:hover { opacity: .85; }
.btn-secondary {
  background: var(--surface0); color: var(--subtext0); border: 1px solid var(--surface1);
  border-radius: 7px; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: all .15s;
}
.btn-secondary:hover { color: var(--text); background: var(--surface1); }
.api-test-result { font-size: 12px; margin-top: 8px; padding: 6px 10px; border-radius: 5px; }
.api-test-result.ok  { background: rgba(166,227,161,.15); color: var(--green); }
.api-test-result.err { background: rgba(243,139,168,.15); color: var(--red); }

/* ── Drag overlay ── */
#drag-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(137,180,250,.07); border: 3px dashed var(--blue);
  pointer-events: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
}
#drag-overlay.active { display: flex; }
#drag-overlay .drag-icon  { font-size: 64px; }
#drag-overlay .drag-text  { font-size: 20px; font-weight: 700; color: var(--blue); }
#drag-overlay .drag-sub   { font-size: 13px; color: var(--subtext0); }

/* ── Spinner & Animations ── */
.spinner {
  width: 16px; height: 16px; border: 2px solid var(--surface1); border-top-color: var(--blue);
  border-radius: 50%; animation: spin .8s linear infinite; display: inline-block;
}
@keyframes spin  { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Toast ── */
#toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--surface1); color: var(--text);
  padding: 8px 16px; border-radius: 8px; font-size: 13px;
  opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; z-index: 400;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Scrollbars */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 3px; }

/* ══ Study Mode ══ */
#study-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.78); z-index: 500;
  display: none; align-items: center; justify-content: center;
}
#study-overlay.open { display: flex; }
#study-panel {
  background: var(--mantle); border: 1px solid var(--surface1);
  border-radius: 16px; width: min(680px, 96vw); max-height: 92vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.study-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 20px; border-bottom: 1px solid var(--surface0); flex-shrink: 0;
}
.study-header h2 { flex: 1; font-size: 15px; font-weight: 700; }
.study-mode-tabs {
  display: flex; gap: 0; flex-shrink: 0;
  border-bottom: 1px solid var(--surface0);
}
.study-tab {
  flex: 1; padding: 10px; border: none; border-bottom: 2px solid transparent;
  background: none; color: var(--subtext0); cursor: pointer;
  font-size: 13px; font-weight: 600; transition: all .15s;
}
.study-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.study-body {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.study-prog-wrap { height: 4px; background: var(--surface0); border-radius: 2px; }
.study-prog-bar  { height: 4px; background: var(--blue); border-radius: 2px; transition: width .35s; }
.study-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--subtext0); margin-top: 4px; }
/* Flashcard */
.flashcard-wrap { perspective: 1000px; height: 240px; cursor: pointer; }
.flashcard {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform .45s;
  border-radius: 14px;
}
.flashcard.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0; border-radius: 14px;
  backface-visibility: hidden; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  padding: 24px; border: 1px solid var(--surface1);
}
.card-front { background: var(--surface0); }
.card-back  { background: var(--base); transform: rotateY(180deg); }
.card-word-en { font-size: 34px; font-weight: 700; color: var(--blue); text-align: center; }
.card-pos     { font-size: 12px; color: var(--overlay0); }
.card-hint    { font-size: 11px; color: var(--overlay0); margin-top: 6px; }
.card-paper   { font-size: 10px; color: var(--overlay0); }
.card-word-ko { font-size: 22px; font-weight: 700; color: var(--green); text-align: center; }
.card-definition { font-size: 12px; color: var(--subtext0); text-align: center; max-width: 480px; line-height:1.5; }
.card-example { font-size: 12px; color: var(--subtext0); text-align: center; font-style: italic; max-width: 480px; line-height: 1.6; }
.card-example em { color: var(--yellow); font-style: normal; font-weight: 600; }
/* SRS buttons */
.srs-btns { display: flex; gap: 8px; }
.srs-btn {
  flex: 1; padding: 9px 6px; border-radius: 8px; border: none;
  font-size: 12px; font-weight: 700; cursor: pointer; transition: all .15s;
}
.srs-btn.wrong { background: rgba(243,139,168,.18); color: var(--red); }
.srs-btn.hard  { background: rgba(249,226,175,.18); color: var(--yellow); }
.srs-btn.good  { background: rgba(166,227,161,.18); color: var(--green); }
.srs-btn.easy  { background: rgba(137,180,250,.18); color: var(--blue); }
.srs-btn:hover { filter: brightness(1.25); }
.study-reveal-btn {
  width: 100%; padding: 11px; background: var(--blue); color: var(--base);
  border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: opacity .2s;
}
.study-reveal-btn:hover { opacity: .82; }
/* Cloze */
.cloze-sentence {
  background: var(--surface0); border-radius: 12px;
  padding: 22px; font-size: 15px; line-height: 2; text-align: center;
}
.cloze-blank {
  display: inline-block; min-width: 100px;
  border-bottom: 2px solid var(--blue); padding: 0 6px; margin: 0 3px;
}
.cloze-row { display: flex; gap: 8px; }
.cloze-input {
  flex: 1; padding: 10px 14px; border-radius: 8px;
  background: var(--surface0); border: 1px solid var(--surface1);
  color: var(--text); font-size: 15px; outline: none; transition: border-color .2s;
}

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  Setup
// ══════════════════════════════════════════════
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const VOCAB_KEY      = 'pv_vocabulary';
const PAPERS_KEY     = 'pv_papers';
const KNOWN_KEY      = 'pv_known';
const MODEL_KEY      = 'pv_gemini_model';
const CLOUD_FUNCTION_URL = 'https://us-central1-gen-lang-client-0468351363.cloudfunctions.net/geminiProxy';

const state = {
  pdf: null, currentPage: 1, totalPages: 0,
  pageTexts: {}, pageTranslations: {},
  paperText: '', paperTitle: '', paperId: null,
  currentPaperWords: [], selectedWord: null,
  vocabCollapsed: false, vocabFilter: 'all', viewMode: 'split',
};

let allVocabulary = JSON.parse(localStorage.getItem(VOCAB_KEY)  || '{}');
let allPapers     = JSON.parse(localStorage.getItem(PAPERS_KEY) || '{}');
let knownWords    = new Set(JSON.parse(localStorage.getItem(KNOWN_KEY) || '[]'));
let openFolders   = new Set(Object.keys(allPapers)); // 폴더 열림 상태

// ══════════════════════════════════════════════
//  Gemini API
// ══════════════════════════════════════════════
const getGeminiModel = () => {
  // Vertex AI에서 확인된 사용 가능 모델로 고정
  // (3.5-flash는 Vertex AI us-central1 미배포 — 추후 업데이트 예정)
  localStorage.setItem(MODEL_KEY, 'gemini-2.5-flash');
  return 'gemini-2.5-flash';
};
const hasGeminiKey = () => true; // Cloud Function 사용 — 키 불필요

async function callGemini(prompt, maxTokens = 4096, jsonMode = false) {
  const model = getGeminiModel();

  const body = JSON.stringify({ prompt, maxTokens, model, jsonMode });

  // 503(과부하) / 429(Rate Limit) 시 최대 3회 자동 재시도
  for (let attempt = 0; attempt < 3; attempt++) {
    const controller = new AbortController();
    const timeoutId  = setTimeout(() => controller.abort(), 60000); // 60초 클라이언트 타임아웃
    let res;
    try {
      res = await fetch(CLOUD_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
        signal: controller.signal,
      });
    } finally {
      clearTimeout(timeoutId);
    }

    if (res.status === 503 || res.status === 429) {
      if (attempt < 2) {
        const wait = (attempt + 1) * 3000;
        const reason = res.status === 429 ? 'API 한도 초과' : 'Gemini 서버 혼잡';
        showToast(`⏳ ${reason} — ${wait/1000}초 후 재시도 (${attempt+1}/3)...`);
        await sleep(wait);
        continue;
      }
    }

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      // Cloud Function은 { error: "string" } 형식으로 반환
      throw new Error(err?.error?.message || err?.error || `HTTP ${res.status}`);
    }
    const data = await res.json();
    return data.text || '';
  }
  throw new Error('서버 과부하 — 잠시 후 다시 시도해주세요');
}

// ══════════════════════════════════════════════
//  Gemini Translation — 단락별 원문+번역 쌍 반환
// ══════════════════════════════════════════════
function isHeaderLine(t) {
  return t.length < 90 && !/[.!?,]$/.test(t) && (
    /^\d+[\.\)]\s/.test(t) ||
    /^[IVXLC]+[\.\)]\s/.test(t) ||
    /^[A-Z][A-Z\s\d\-:]{3,}$/.test(t) ||
    /^(abstract|introduction|conclusion|methods?|results?|discussion|references?|background|related\s+work|experiment|evaluation|appendix|acknowledgment)/i.test(t)
  );
}

function splitParas(text) {
  // 빈 줄 기준 분리, 단일 \n은 같은 단락으로 합침
  return text
    .split(/\n{2,}/)
    .map(p => p.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim())
    .filter(p => p.length > 3);
}

async function translateWithGemini(pageText) {
  const rawParas = splitParas(pageText);
  if (!rawParas.length) return { type: 'bilingual', pairs: [] };

  const prompt = `당신은 학술 논문 전문 번역가입니다. 아래 영문 단락들을 자연스럽고 정확한 한국어 학술 문체로 번역하세요.

규칙:
- 전문 용어 첫 등장 시 "한국어(영문)" 형식 (예: 칼만 필터(Kalman filter))
- 수식·참고문헌 번호 [1], (2) 등은 그대로 유지
- 자연스러운 한국어 — 직역 금지
- 반드시 단락 번호 순서대로 정확히 ${rawParas.length}개 번역 제공

아래 JSON 배열만 반환하세요. 다른 텍스트 없이:
[{"ko":"번역문"}]

번역할 단락 (${rawParas.length}개):
${rawParas.map((p, i) => `[${i + 1}] ${p}`).join('\n\n')}`;

  const raw = await callGemini(prompt, 8192, true); // JSON 모드
  const match = raw.match(/\[[\s\S]*\]/);
  if (!match) throw new Error('JSON 파싱 실패');
  const translations = JSON.parse(match[0]);

  return {
    type: 'bilingual',
    pairs: rawParas.map((en, i) => ({
      en,
      ko:       translations[i]?.ko || '—',
      isHeader: isHeaderLine(en),
    })),
  };
}

// ══════════════════════════════════════════════
//  MyMemory Fallback Translation
// ══════════════════════════════════════════════
function splitChunks(text, maxLen) {
  const sentences = splitSentences(text);
  const chunks = []; let cur = '';
  for (const s of sentences) {
    if ((cur + s).length > maxLen && cur) { chunks.push(cur.trim()); cur = s; }
    else cur += ' ' + s;
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks.filter(c => c.length > 1);
}

async function callMyMemory(text) {
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0, 500))}&langpair=en|ko`;
  const res  = await fetch(url);
  const data = await res.json();
  if (data.responseStatus === 200) return data.responseData.translatedText;
  throw new Error(data.responseStatus);
}

async function translateWithMyMemory(text) {
  const chunks     = splitChunks(text.replace(/\s+/g, ' ').trim(), 380);
  const translated = [];
  for (const chunk of chunks) {
    try {
      const t = await callMyMemory(chunk);
      translated.push({ source: chunk, translation: t, error: false });
    } catch {
      translated.push({ source: chunk, translation: '[번역 실패]', error: true });
    }
    await sleep(300);
  }
  return translated;
}

// ══════════════════════════════════════════════
//  Page Translation (Claude or MyMemory)
// ══════════════════════════════════════════════
async function translatePage(pageNum, text) {
  if (state.pageTranslations[pageNum]) {
    renderTranslation(state.pageTranslations[pageNum]);
    return;
  }

  const el  = document.getElementById('translation-content');
  const tag = document.getElementById('trans-engine-tag');
  const useAI = hasGeminiKey();

  el.innerHTML = `<div class="trans-loading"><span class="spinner"></span>&nbsp;${useAI ? 'Gemini AI 번역 중...' : 'MyMemory 번역 중...'}</div>`;
  tag.textContent = useAI ? 'Gemini AI' : 'MyMemory';
  tag.className   = 'trans-engine-tag ' + (useAI ? 'claude' : 'mymemory');

  if (!text.trim()) {
    el.innerHTML = '<div style="padding:20px;color:var(--overlay0)">텍스트를 추출할 수 없습니다.</div>';
    return;
  }

  let result;
  if (useAI) {
    try {
      result = await translateWithGemini(text);
    } catch (e) {
      // 실패 시 재시도 버튼 표시
      el.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 20px;text-align:center">
          <div style="font-size:28px">⚠️</div>
          <div style="color:var(--red);font-size:13px;font-weight:600">번역 실패</div>
          <div style="color:var(--subtext0);font-size:12px;max-width:320px;line-height:1.6">${esc(e.message)}</div>
          <div style="display:flex;gap:8px;margin-top:4px">
            <button onclick="retryTranslation(${pageNum})"
              style="padding:8px 18px;background:var(--blue);color:var(--base);border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer">
              🔄 다시 시도
            </button>
            <button onclick="fallbackToMyMemory(${pageNum})"
              style="padding:8px 18px;background:var(--surface0);color:var(--subtext0);border:1px solid var(--surface1);border-radius:7px;font-size:13px;cursor:pointer">
              MyMemory로 번역
            </button>
          </div>
        </div>`;
      tag.textContent = '오류';
      tag.className   = 'trans-engine-tag';
      return;
    }
  } else {
    result = { type: 'mymemory', pairs: await translateWithMyMemory(text.replace(/\s+/g,' ').trim()) };
  }

  state.pageTranslations[pageNum] = result;
  renderTranslation(result);
}

async function retryTranslation(pageNum) {
  delete state.pageTranslations[pageNum]; // 캐시 삭제 후 재시도
  const text = await extractPageText(pageNum);
  await translatePage(pageNum, text);
}

async function fallbackToMyMemory(pageNum) {
  const el  = document.getElementById('translation-content');
  const tag = document.getElementById('trans-engine-tag');
  el.innerHTML = `<div class="trans-loading"><span class="spinner"></span>&nbsp;MyMemory 번역 중...</div>`;
  const text = await extractPageText(pageNum);
  const result = { type: 'mymemory', pairs: await translateWithMyMemory(text.replace(/\s+/g,' ').trim()) };
  state.pageTranslations[pageNum] = result;
  renderTranslation(result);
}

// 백그라운드에서 전체 페이지 순차 번역 (2페이지부터 — 1페이지는 메인에서 처리)
let _bgTranslationId = 0; // PDF 바뀌면 이전 루프 중단용
async function startBackgroundTranslation(sessionId) {
  await sleep(2000); // 1페이지 번역 먼저 끝나도록 대기
  for (let page = 2; page <= state.totalPages; page++) {
    if (_bgTranslationId !== sessionId) return; // PDF 바뀌면 중단
    if (state.pageTranslations[page]) continue;  // 이미 번역됨
    try {
      const text = await extractPageText(page);
      if (_bgTranslationId !== sessionId) return;
      if (text && text.trim()) {
        const result = hasGeminiKey()
          ? await translateWithGemini(text)
          : { type: 'mymemory', pairs: await translateWithMyMemory(text.replace(/\s+/g,' ').trim()) };
        if (_bgTranslationId !== sessionId) return;
        state.pageTranslations[page] = result;
        updateBgProgress(page, state.totalPages);
      }
    } catch {}
    await sleep(300); // API 과부하 방지
  }
  updateBgProgress(null, state.totalPages); // 완료
}

function updateBgProgress(page, total) {
  let el = document.getElementById('bg-translate-progress');
  if (!el) return;
  if (page === null) {
    el.textContent = '✅ 전체 번역 완료';
    setTimeout(() => { el.textContent = ''; }, 3000);
  } else {
    const done = Object.keys(state.pageTranslations).length;
    el.textContent = `⏳ 백그라운드 번역 중… ${done}/${total}`;
  }
}

function renderTranslation(result) {
  const el  = document.getElementById('translation-content');
  const tag = document.getElementById('trans-engine-tag');

  if (result.type === 'bilingual') {
    tag.textContent = 'Gemini AI';
    tag.className   = 'trans-engine-tag claude';

    if (!result.pairs || !result.pairs.length) {
      el.innerHTML = '<div style="padding:20px;color:var(--overlay0)">번역 결과가 없습니다.</div>';
      return;
    }

    el.innerHTML = result.pairs.map(pair =>
      pair.isHeader
        ? `<div class="trans-hdr">${esc(pair.ko)}</div>`
        : `<p class="trans-p">${esc(pair.ko)}</p>`
    ).join('');

  } else {
    // MyMemory 폴백
    tag.textContent = 'MyMemory';
    tag.className   = 'trans-engine-tag mymemory';

    const sentences = result.pairs.filter(p => !p.error).map(p => p.translation.trim());
    let html = '<div class="trans-mymemory-note">ℹ️ MyMemory 번역 (Gemini 오류로 인한 폴백 — 품질 제한)</div>';
    const CHUNK = 4;
    for (let i = 0; i < sentences.length; i += CHUNK)
      html += `<p class="trans-p">${esc(sentences.slice(i, i + CHUNK).join(' '))}</p>`;
    el.innerHTML = html;
  }
}

// ══════════════════════════════════════════════
//  Claude Vocabulary Extraction
// ══════════════════════════════════════════════
async function extractVocabWithGemini(fullText) {
  const sample = fullText.slice(0, 14000);

  const prompt = `당신은 학술 논문 분석 및 영어 교육 전문가입니다. 아래 논문에서 영어 공부에 중요한 전문 용어와 학술 어휘를 추출하세요.

선택 기준:

JSON 배열만 반환 (마크다운·코드블록 없이, 다른 텍스트 없이):

60~80개 단어를 추출하세요.

논문 텍스트:
${sample}`;

  const raw = await callGemini(prompt, 8192, true); // JSON 모드

  const match = raw.match(/\[[\s\S]*\]/);

async function fetchDefinitionFallback(word) {
  let definition = '', pos = '', korean = '', example = '';
  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
    if (res.ok) {
      const data    = await res.json();
      const meaning = data[0]?.meanings[0];
      definition = meaning?.definitions[0]?.definition || '';
      example    = meaning?.definitions[0]?.example    || '';
      pos        = meaning?.partOfSpeech || '';
    }
  } catch {}
  try {
    const res  = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ko`);
    const data = await res.json();
    if (data.responseStatus === 200) korean = data.responseData.translatedText;
  } catch {}
  if (isBadKoreanMeaning(korean, word)) korean = await fetchKoreanMeaningFallback(word, { definition, pos, example });
  return { definition, pos, korean, example };
}

function hasKorean(text) {
  return /[가-힣]/.test(String(text || ''));
}

function isBadKoreanMeaning(korean, word) {
  const value = String(korean || '').trim();
  if (!value || value === '조회 중...' || value === '—') return true;
  if (value.toLowerCase() === String(word || '').toLowerCase()) return true;
  if (!hasKorean(value)) return true;
  return false;
}

function cleanKoreanMeaning(korean, word) {
  const value = String(korean || '').replace(/\s+/g, ' ').trim();
  if (isBadKoreanMeaning(value, word)) return '';
  return value.length > 80 ? value.slice(0, 80).trim() : value;
}

async function fetchKoreanMeaningWithGemini(word, info = {}) {
  const prompt = `다음 영어 논문 단어의 한국어 뜻만 짧게 반환하세요.

규칙:
- 반드시 한국어로만 답하세요.
- 예문, 영어 설명, 문장 번역을 쓰지 마세요.
- 쉼표로 구분한 뜻 1~3개만 쓰세요.
- JSON 객체만 반환하세요: {"korean":"한국어 뜻"}

word: ${word}
part of speech: ${info.pos || ''}
english definition: ${info.definition || ''}
example/context: ${info.example || findExampleSentence(word) || ''}`;

  const raw = await callGemini(prompt, 512, true);
  const match = raw.match(/\{[\s\S]*\}/);
  const parsed = JSON.parse(match ? match[0] : raw);
  return cleanKoreanMeaning(parsed.korean, word);
}

async function fetchKoreanMeaningFallback(word, info = {}) {
  if (hasGeminiKey()) {
    try {
      const geminiMeaning = await fetchKoreanMeaningWithGemini(word, info);
      if (geminiMeaning) return geminiMeaning;
    } catch {}
  }

  try {
    const direct = await callMyMemory(word);
    const cleaned = cleanKoreanMeaning(direct, word);
    if (cleaned) return cleaned;
  } catch {}

  return '뜻 확인 필요';
}

async function repairBadKoreanMeanings(limit = 30) {
  const targets = Object.keys(allVocabulary)
    .filter(word => isBadKoreanMeaning(allVocabulary[word]?.korean, word))
    .slice(0, limit);

  if (!targets.length) return 0;
  showToast(`뜻 보정 중... (${targets.length}개)`);

  let fixed = 0;
  for (const word of targets) {
    const meaning = await fetchKoreanMeaningFallback(word, allVocabulary[word]);
    allVocabulary[word].korean = meaning;
    fixed++;
    if (fixed % 5 === 0) {
      localStorage.setItem(VOCAB_KEY, JSON.stringify(allVocabulary));
      renderVocabulary();
      await sleep(120);
    }
  }

  localStorage.setItem(VOCAB_KEY, JSON.stringify(allVocabulary));
  renderVocabulary();
  showToast(`한국어 뜻 보정 완료 (${fixed}개)`);
  return fixed;
}

async function processVocabulary(fullText) {
  if (hasGeminiKey()) {
    showToast('🤖 Gemini AI로 핵심 단어 추출 중...');
    try {
      const items = await extractVocabWithGemini(fullText);
      state.currentPaperWords = items.map(i => i.word.toLowerCase());

      for (const item of items) {
        const word = item.word.toLowerCase();
        const korean = cleanKoreanMeaning(item.korean, word);
        if (!allVocabulary[word]) {
          allVocabulary[word] = {
            definition: item.definition || '',
            pos:        item.pos        || '',
            korean:     korean          || '조회 중...',
            example:    item.example    || '',
            papers:     [state.paperId],
            totalCount: 1,
            firstSeen:  today(),
          };
        } else {
          if (!allVocabulary[word].papers.includes(state.paperId))
            allVocabulary[word].papers.push(state.paperId);
          // Update with Claude data if better
          if (!allVocabulary[word].example && item.example) allVocabulary[word].example = item.example;
          if (!allVocabulary[word].definition && item.definition) allVocabulary[word].definition = item.definition;
          if (isBadKoreanMeaning(allVocabulary[word].korean, word) && korean) allVocabulary[word].korean = korean;
        }
      }
      localStorage.setItem(VOCAB_KEY, JSON.stringify(allVocabulary));
      renderVocabulary();
      await repairBadKoreanMeanings(40);

      const repeats = state.currentPaperWords.filter(w => (allVocabulary[w]?.papers?.length || 0) > 1).length;
      showToast(`✅ Gemini AI: ${items.length}개 단어 추출 | 재등장 ${repeats}개`);
      updateStudyBadge();
      return;
    } catch (e) {
      showToast(`⚠️ Gemini 추출 실패 → 기본 방식 전환: ${e.message}`);
    }
  }

  // Fallback: frequency-based
  showToast('📊 단어 빈도 분석 중...');
  const raw  = fullText.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/);
  const freq = {};
  for (const w of raw) {
    if (w.length >= 5 && !STOPWORDS.has(w) && /^[a-z]+$/.test(w))
      freq[w] = (freq[w] || 0) + 1;
  }
  const topWords = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0, 80)
    .map(([word, count]) => ({ word, count }));

  state.currentPaperWords = topWords.map(w => w.word);
  topWords.forEach(({ word, count }) => {
    if (!allVocabulary[word]) {
      allVocabulary[word] = { definition:'', pos:'', korean:'조회 중...', example:'', papers:[state.paperId], totalCount: count, firstSeen: today() };
    } else {
      if (!allVocabulary[word].papers.includes(state.paperId)) allVocabulary[word].papers.push(state.paperId);
      allVocabulary[word].totalCount = (allVocabulary[word].totalCount || 0) + count;
    }
  });
  renderVocabulary();

  // Parallel definition fetches (batches of 5)
  let newCount = 0;
  const needDef = topWords.filter(({ word }) =>
    !allVocabulary[word].definition || isBadKoreanMeaning(allVocabulary[word].korean, word)
  );
  for (let i = 0; i < needDef.length; i += 5) {
    const batch = needDef.slice(i, i + 5);
    await Promise.all(batch.map(async ({ word }) => {
      const def = await fetchDefinitionFallback(word);
      allVocabulary[word] = { ...allVocabulary[word], ...def };
      newCount++;
    }));
    localStorage.setItem(VOCAB_KEY, JSON.stringify(allVocabulary));
    renderVocabulary();
    await sleep(80);
  }

  localStorage.setItem(VOCAB_KEY, JSON.stringify(allVocabulary));
  renderVocabulary();
  showToast(`✅ ${newCount}개 신규 단어 | 재등장 ${topWords.filter(w=>(allVocabulary[w.word]?.papers?.length||0)>1).length}개`);
}

/* ── 단어 행 HTML 생성 헬퍼 ── */
function _wordRowHtml(word, indentLeft = false) {
  const info     = allVocabulary[word];
  const repeated = info.papers.length > 1;
  const loading  = !info.definition && info.korean === '조회 중...';
  const isKnown  = knownWords.has(word);
  const rowClass = ['word-row',
    repeated ? 'repeated-row' : 'new-row',
    isKnown  ? 'known-row'    : '',
    loading  ? 'wr-loading'   : '',
    state.selectedWord === word ? 'selected' : '',
    indentLeft ? 'folder-word-row' : '',
  ].join(' ').trim();
  const indClass = isKnown ? 'known' : repeated ? 'repeated' : 'new';
  const tooltip  = [info.pos ? `[${info.pos}]` : '', info.definition || ''].filter(Boolean).join(' ');
  return `<div class="${rowClass}" title="${esc(tooltip)}" onclick="selectWord('${word}')">
    <span class="wr-indicator ${indClass}"></span>
    <span class="wr-word">${esc(word)}</span>
    <span class="wr-korean">${esc(info.korean||(loading?'...':'—'))}</span>
    <span class="wr-freq">${info.totalCount||0}</span>
    <button class="wr-know-btn ${isKnown?'known':''}"
      onclick="event.stopPropagation();toggleKnown('${word}')"
      title="${isKnown?'모르는 단어로 변경':'알고 있는 단어로 표시'}">
      ${isKnown?'✓':'○'}
    </button>
  </div>`;
}

function renderVocabulary() {
  const content = document.getElementById('vocab-content');
  const search  = document.getElementById('vocab-search').value.toLowerCase().trim();
  const filter  = state.vocabFilter;

  /* ── 논문별 폴더 뷰 ── */
  if (filter === 'papers') {
    const sortedPapers = Object.entries(allPapers)
      .sort((a, b) => (b[1].date || '').localeCompare(a[1].date || ''));

    if (!sortedPapers.length) {
      content.innerHTML = '<div style="padding:24px;color:var(--overlay0);font-size:12px;text-align:center">업로드된 논문이 없습니다</div>';
      document.getElementById('vocab-count').textContent = '0 논문';
      renderWordDetail(); return;
    }

    let totalWords = 0;
    content.innerHTML = sortedPapers.map(([paperId, paperInfo]) => {
      let words = Object.keys(allVocabulary)
        .filter(w => allVocabulary[w].papers.includes(paperId) && !knownWords.has(w));
      if (search) words = words.filter(w =>
        w.includes(search) || (allVocabulary[w].korean || '').includes(search));
      words.sort((a, b) => (allVocabulary[b].totalCount||0) - (allVocabulary[a].totalCount||0));
      totalWords += words.length;

      const isOpen = openFolders.has(paperId);
      const title  = paperInfo.title || paperId.split('_')[0];
      const short  = title.length > 28 ? title.slice(0, 28) + '…' : title;

      return `<div class="paper-folder">
        <div class="paper-folder-hdr" onclick="toggleFolder('${esc(paperId).replace(/'/g,"\\'")}')">
          <span class="folder-arrow ${isOpen ? 'open' : ''}">▶</span>
          <span style="margin-right:4px;font-size:13px">${isOpen ? '📂' : '📁'}</span>
          <span class="folder-title" title="${esc(title)}">${esc(short)}</span>
          <span class="folder-count">${words.length}</span>
        </div>
        ${isOpen ? `<div class="paper-folder-content">${
          words.length
            ? words.map(w => _wordRowHtml(w, true)).join('')
            : '<div style="padding:6px 20px;font-size:11px;color:var(--overlay0)">단어 없음</div>'
        }</div>` : ''}
      </div>`;
    }).join('');

    document.getElementById('vocab-count').textContent = `${sortedPapers.length}편 / ${totalWords}단어`;
    renderWordDetail(); return;
  }

  /* ── 기존 평면 뷰 ── */
  let wordList = Object.keys(allVocabulary);

  if (filter === 'known') {
    wordList = wordList.filter(w => knownWords.has(w));
  } else {
    wordList = wordList.filter(w => !knownWords.has(w));
    if (filter === 'current')  wordList = wordList.filter(w => state.currentPaperWords.includes(w));
    if (filter === 'repeated') wordList = wordList.filter(w => allVocabulary[w].papers.length > 1);
  }
  if (search) wordList = wordList.filter(w => w.includes(search) || (allVocabulary[w].korean||'').includes(search));

  wordList.sort((a, b) => {
    const ar = allVocabulary[a].papers.length > 1, br = allVocabulary[b].papers.length > 1;
    if (ar && !br) return -1; if (!ar && br) return 1;
    return (allVocabulary[b].totalCount||0) - (allVocabulary[a].totalCount||0);
  });

  document.getElementById('vocab-count').textContent = `${wordList.length} 단어`;

  if (!wordList.length) {
    content.innerHTML = '<div style="padding:24px;color:var(--overlay0);font-size:12px;text-align:center">표시할 단어가 없습니다</div>';
    renderWordDetail(); return;
  }

  content.innerHTML = wordList.map(w => _wordRowHtml(w)).join('');
  renderWordDetail();
}

function selectWord(word) {
  state.selectedWord = state.selectedWord === word ? null : word;
  renderVocabulary();
}

function renderWordDetail() {
  const detail = document.getElementById('word-detail');
  if (!detail) return;
  const word = state.selectedWord;
  const info = word ? allVocabulary[word] : null;

  if (!word || !info) {
    detail.innerHTML = '<div class="word-detail-empty">단어를 클릭하면<br>상세 정보를 볼 수 있습니다</div>';
    return;
  }

  const paperList  = info.papers.map(id => allPapers[id]?.title || id.split('_')[0]).join(', ');
  const example    = info.example || findExampleSentence(word);
  const isKnown    = knownWords.has(word);

  // Highlight word in example (특수문자 이스케이프)
  const ew2 = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const hlExample  = example
    ? example.replace(new RegExp(`\\b(${ew2}s?|${ew2}ing|${ew2}ed)\\b`, 'gi'),
        m => `<em>${m}</em>`)
    : '';

  detail.innerHTML = `
    <div class="detail-header">
      <span class="detail-word-en">${esc(word)}</span>
      <span class="detail-pos">${esc(info.pos||'')}</span>
      <button class="detail-tts" onclick="speakWord('${esc(word)}')" title="발음 듣기">🔊</button>
      <button class="detail-know-btn ${isKnown?'known':''}" onclick="toggleKnown('${word}')" style="margin-left:auto">
        ${isKnown?'✓ 알고 있음':'알고 있어요'}
      </button>
    </div>
    <div class="detail-korean">${esc(info.korean||'—')}</div>
    <div class="detail-definition">${esc(info.definition||'정의를 불러오는 중...')}</div>
    <div class="detail-chips">
      <span class="detail-chip">빈도 ${info.totalCount||0}회</span>
      <span class="detail-chip">논문 ${info.papers.length}편</span>
      <span class="detail-chip">첫 발견 ${info.firstSeen||'—'}</span>
    </div>
    ${hlExample ? `<div class="detail-section-title">예문</div><div class="detail-example">${hlExample}</div>` : ''}
    <div class="detail-section-title">출현 논문</div>
    <div class="detail-example">${esc(paperList)}</div>
  `;
}

function speakWord(word) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(word);
  utt.lang = 'en-US'; utt.rate = 0.9;
  window.speechSynthesis.speak(utt);
}

function findExampleSentence(word) {
  const src = state.paperText || Object.values(state.pageTexts).join('\n');
  if (!src) return '';
  const ew = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`\\b${ew}\\b`, 'i');
  return splitSentences(src).map(s => s.replace(/\s+/g,' ').trim()).find(s => re.test(s) && s.length > 20 && s.length < 300) || '';
}

function splitSentences(text) { return text.match(/[^.!?\n]+[.!?\n]*/g) || [text]; }

function toggleFolder(paperId) {
  if (openFolders.has(paperId)) openFolders.delete(paperId);
  else openFolders.add(paperId);
  renderVocabulary();
}

function toggleKnown(word) {
  knownWords.has(word) ? knownWords.delete(word) : knownWords.add(word);
  localStorage.setItem(KNOWN_KEY, JSON.stringify([...knownWords]));
  renderVocabulary();
}

function exportCSV() {
  const rows = [['단어','품사','한국어','영어 정의','예문','빈도','출현 논문','첫 발견','알고 있음']];
  for (const [word, info] of Object.entries(allVocabulary)) {
    const papers = info.papers.map(id => allPapers[id]?.title || id.split('_')[0]).join(' | ');
    rows.push([word, info.pos, info.korean, info.definition, info.example||'', info.totalCount||0, papers, info.firstSeen, knownWords.has(word)?'예':'아니오']);
  }
  const csv = rows.map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `PaperVocab_${today()}.csv`;
  a.click();
  showToast(`✅ CSV 내보내기 완료 (${Object.keys(allVocabulary).length}개 단어)`);
}

async function loadPDF(file) {
  showToast('📂 PDF 로딩 중...');
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

    Object.assign(state, {
      pdf, totalPages: pdf.numPages, currentPage: 1,
      pageTexts: {}, pageTranslations: {}, paperText: '',
      paperTitle: file.name.replace(/\.pdf$/i, ''),
      currentPaperWords: [], selectedWord: null,
    });
    state.paperId = generateId(state.paperTitle);

    if (!allPapers[state.paperId]) {
      allPapers[state.paperId] = { title: state.paperTitle, date: today(), pages: pdf.numPages };
      localStorage.setItem(PAPERS_KEY, JSON.stringify(allPapers));
    }
    openFolders.add(state.paperId); // 새 논문 폴더는 기본 열림

    document.getElementById('paper-title').textContent = state.paperTitle;
    document.getElementById('prev-btn').disabled = true;
    document.getElementById('next-btn').disabled = pdf.numPages <= 1;
    document.getElementById('empty-left').style.display  = 'none';
    document.getElementById('empty-right').style.display = 'none';
    document.getElementById('pdf-canvas').style.display  = 'block';
    document.getElementById('translation-wrapper').style.display = 'block';

    await renderPage(1);

    // Extract all text → vocabulary (background)
    extractAllText().then(fullText => {
      state.paperText = fullText;
      processVocabulary(fullText);
    });

    // 전체 페이지 백그라운드 번역 시작
    const sessionId = ++_bgTranslationId;
    startBackgroundTranslation(sessionId);
  } catch (e) {
    showToast('❌ PDF 로딩 실패: ' + e.message);
  }
}

function generateId(title) {
  return title.replace(/[^a-zA-Z0-9]/g,'').slice(0,16) + '_' + Date.now().toString(36);
}

async function renderPage(pageNum) {
  if (!state.pdf) return;
  state.currentPage = pageNum;
  const page      = await state.pdf.getPage(pageNum);
  const container = document.getElementById('left-panel');
  const canvas    = document.getElementById('pdf-canvas');
  const maxW      = container.clientWidth - 32;
  const vp0    = page.getViewport({ scale: 1 });
  const scale  = Math.min(maxW / vp0.width, 2.5);
  const vp     = page.getViewport({ scale });

  canvas.width  = vp.width;
  canvas.height = vp.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

  document.getElementById('page-info').textContent = `${pageNum} / ${state.totalPages}`;
  document.getElementById('prev-btn').disabled = pageNum <= 1;
  document.getElementById('next-btn').disabled = pageNum >= state.totalPages;

  const text = await extractPageText(pageNum);
  await translatePage(pageNum, text);
}

async function extractPageText(pageNum) {
  if (state.pageTexts[pageNum]) return state.pageTexts[pageNum];
  const page    = await state.pdf.getPage(pageNum);
  const content = await page.getTextContent();
  let text = '', lastY = null;
  for (const item of content.items) {
    if (lastY !== null) {
      const gap = Math.abs(item.transform[5] - lastY);
      if      (gap > 18) text += '\n\n';   // 단락 간격 → 빈 줄
      else if (gap > 4)  text += '\n';     // 줄 바꿈
      else if (text && !text.endsWith('\n') && item.str && !/^\s|[.,;:!?)]/.test(item.str))
        text += ' ';
    }
    text += item.str;
    lastY = item.transform[5];
  }
  state.pageTexts[pageNum] = text.trim();
  return state.pageTexts[pageNum];
}

async function extractAllText() {
  const pages = [];
  for (let i = 1; i <= state.totalPages; i++) pages.push(await extractPageText(i));
  return pages.join('\n');
}

const SRS_KEY = 'pv_srs';
let srsData = JSON.parse(localStorage.getItem(SRS_KEY) || '{}');

const studyState = {
  mode: 'flashcard', queue: [], idx: 0,
  flipped: false, answered: false,
  correct: 0, wrong: 0, sessionTotal: 0,
};

function saveSRS() { localStorage.setItem(SRS_KEY, JSON.stringify(srsData)); }

function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

function getDueWords() {
  const t = today();
  const due = [], newWords = [];
  for (const word of Object.keys(allVocabulary)) {
    if (knownWords.has(word)) continue;
    const s = srsData[word];
    if (!s) newWords.push(word);
    else if (s.nextReview <= t) due.push(word);
  }
  due.sort((a, b) => (srsData[a].nextReview||'').localeCompare(srsData[b].nextReview||''));
  return [...due.slice(0, 15), ...newWords.slice(0, 10)].slice(0, 20);
}

function applyRating(word, rating) {
  if (!srsData[word]) srsData[word] = { interval:1, ease:2.5, reviewCount:0, lapses:0, nextReview:today() };
  const s = srsData[word];
  s.reviewCount++;
  let iv;
  if (rating === 0) {
    iv = 1; s.ease = Math.max(1.3, s.ease - 0.2); s.lapses++;
  } else if (rating === 1) {
    iv = Math.max(1, Math.ceil(s.interval * 1.2)); s.ease = Math.max(1.3, s.ease - 0.15);
  } else if (rating === 2) {
    iv = s.reviewCount <= 1 ? 1 : s.reviewCount === 2 ? 3 : Math.max(1, Math.ceil(s.interval * s.ease));
  } else {
    iv = s.reviewCount <= 2 ? 4 : Math.max(1, Math.ceil(s.interval * s.ease * 1.3));
    s.ease = Math.min(4.0, s.ease + 0.1);
  }
  s.interval = iv;
  s.nextReview = addDays(today(), iv);
  saveSRS();
}

function updateStudyBadge() {
  const cnt = getDueWords().length;
  const badge = document.getElementById('study-badge');

}

}

function closeStudy() {
  document.getElementById('study-overlay').classList.remove('open');

function renderStudyCard() {
  const body = document.getElementById('study-body');
  const { queue, idx, mode, sessionTotal } = studyState;

  if (!Object.keys(allVocabulary).length) {
    body.innerHTML = `<div class="study-empty"><div class="big-emoji">📄</div><p>논문을 업로드하면<br>AI가 단어를 자동으로 추출합니다</p></div>`;
    return;
  }
  if (!queue.length || idx >= queue.length) { renderStudyComplete(); return; }

  const pct = sessionTotal > 0 ? (idx / sessionTotal) * 100 : 0;
  const progressHtml = `
    <div>
      <div class="study-prog-wrap"><div class="study-prog-bar" style="width:${pct}%"></div></div>
      <div class="study-stats"><span>${idx + 1} / ${sessionTotal}</span><span>✅ ${studyState.correct} &nbsp; ❌ ${studyState.wrong}</span></div>
    </div>`;

  if (mode === 'flashcard') renderFlashcard(body, queue[idx], progressHtml);
  else renderCloze(body, queue[idx], progressHtml);
}

function renderFlashcard(body, word, progressHtml) {
  const info = allVocabulary[word] || {};
  const { flipped } = studyState;
  const example = info.example || findExampleSentence(word);
  const ew = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const hlEx = example
    ? example.replace(new RegExp(`\\b(${ew}s?|${ew}ing|${ew}ed)\\b`, 'gi'), m => `<em>${m}</em>`)
    : '';
  const paperName = (info.papers||[]).map(id => allPapers[id]?.title||'').filter(Boolean)[0] || '';

  body.innerHTML = progressHtml + `
    <div class="flashcard-wrap" onclick="flipCard()">
      <div class="flashcard ${flipped?'flipped':''}">
        <div class="card-face card-front">
          <div class="card-word-en">${esc(word)}</div>
          ${info.pos ? `<div class="card-pos">[${esc(info.pos)}]</div>` : ''}
          <button class="detail-tts" onclick="event.stopPropagation();speakWord('${esc(word)}')" title="발음 듣기" style="font-size:18px;padding:4px 8px">🔊</button>
          <div class="card-hint">클릭하여 뜻 확인 👆</div>
          ${paperName ? `<div class="card-paper">📄 ${esc(paperName.length>40?paperName.slice(0,40)+'…':paperName)}</div>` : ''}
        </div>
        <div class="card-face card-back">
          <div class="card-word-ko">${esc(info.korean||'—')}</div>
          ${info.definition ? `<div class="card-definition">${esc(info.definition)}</div>` : ''}
          ${hlEx ? `<div class="card-example">${hlEx}</div>` : ''}
        </div>
      </div>
    </div>
    ${!flipped
      ? `<button class="study-reveal-btn" onclick="flipCard()">정답 보기</button>`
      : `<div class="srs-btns">
          <button class="srs-btn wrong" onclick="rateAndNext(0)">❌ 틀림</button>
          <button class="srs-btn hard"  onclick="rateAndNext(1)">😓 어려움</button>
          <button class="srs-btn good"  onclick="rateAndNext(2)">✅ 맞음</button>
          <button class="srs-btn easy"  onclick="rateAndNext(3)">⚡ 쉬움</button>
        </div>`
    }`;
}

function renderCloze(body, word, progressHtml) {
  const info = allVocabulary[word] || {};
  const src = state.paperText || Object.values(state.pageTexts).join('\n');
  const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); // 정규식 특수문자 이스케이프
  const re = new RegExp(`\\b${escaped}(s|ed|ing|er|est)?\\b`, 'i');
  const sentence = splitSentences(src)
    .map(s => s.replace(/\s+/g,' ').trim())
    .find(s => re.test(s) && s.length > 20 && s.length < 250) || '';

  const hasSentence = !!sentence;
  const displaySentence = hasSentence
    ? sentence.replace(re, '<span class="cloze-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')
    : '';

  const { answered } = studyState;
  body.innerHTML = progressHtml + `
    <div class="cloze-sentence">
      ${hasSentence ? displaySentence
        : `<strong style="color:var(--blue);font-size:20px">${esc(word)}</strong><br>
           <span style="font-size:12px;color:var(--subtext0)">${esc(info.definition||'이 단어의 한국어 뜻은?')}</span>`}
    </div>
    <div class="cloze-row">
      <input class="cloze-input" id="cloze-input" type="text"
        placeholder="${hasSentence ? '빈칸에 들어갈 단어를 입력하세요...' : '한국어 뜻을 입력하세요...'}"
        ${answered ? 'disabled' : ''} autocomplete="off" autocorrect="off" spellcheck="false">
      ${!answered ? `<button class="cloze-submit" onclick="submitCloze('${esc(word)}',${hasSentence})">확인</button>` : ''}
    </div>
    <div class="cloze-feedback" id="cloze-feedback"></div>
    ${answered ? `<div class="srs-btns">
      <button class="srs-btn wrong" onclick="rateAndNext(0)">❌ 틀림</button>
      <button class="srs-btn good"  onclick="rateAndNext(2)">✅ 맞음</button>
      <button class="srs-btn easy"  onclick="rateAndNext(3)">⚡ 쉬움</button>
    </div>` : ''}`;

  if (!answered) {
    const inp = document.getElementById('cloze-input');
    inp?.focus();
    inp?.addEventListener('keydown', e => { if (e.key==='Enter') submitCloze(word, hasSentence); });
  }
}

function flipCard() {
  studyState.flipped = !studyState.flipped;
  renderStudyCard();
}

function submitCloze(word, hasSentence) {
  const info = allVocabulary[word] || {};
  const val = (document.getElementById('cloze-input')?.value || '').trim().toLowerCase();

  let correct = false;
  if (hasSentence) {
    const variants = [word, word+'s', word+'ed', word+'ing', word+'er', word+'est'].map(v => v.toLowerCase());
    correct = variants.includes(val);
  } else {
    const koWords = (info.korean||'').split(/[,·\s]+/).map(k=>k.trim()).filter(k=>k.length>0);
    correct = val.length > 0 && koWords.some(k => val.includes(k) || k.includes(val));
  }

  studyState.answered = true;

  // renderCloze 먼저 호출 (DOM 새로 생성) → 그 다음 피드백 주입
  const body = document.getElementById('study-body');
  const { idx, sessionTotal } = studyState;
  const pct = sessionTotal > 0 ? (idx / sessionTotal) * 100 : 0;
  const progressHtml = `<div>
    <div class="study-prog-wrap"><div class="study-prog-bar" style="width:${pct}%"></div></div>
    <div class="study-stats"><span>${idx+1} / ${sessionTotal}</span><span>✅ ${studyState.correct} &nbsp; ❌ ${studyState.wrong}</span></div>
  </div>`;
  renderCloze(body, word, progressHtml);

  // 새로 생성된 DOM에 피드백 반영
  const inp = document.getElementById('cloze-input');
  const fb  = document.getElementById('cloze-feedback');
  if (inp) { inp.value = val; inp.classList.add(correct ? 'correct' : 'err'); }
  if (fb) {
    fb.className = 'cloze-feedback ' + (correct ? 'ok' : 'err');
    fb.textContent = correct
      ? `✅ 정답! ${hasSentence ? '' : `(${info.korean||''})`}`
      : `❌ 정답: ${hasSentence ? word : info.korean||'—'}`;
  }
}

function rateAndNext(rating) {
  if (rating === 0) studyState.wrong++;
  else studyState.correct++;
  applyRating(studyState.queue[studyState.idx], rating);
  studyState.idx++;
  studyState.flipped = false;
  studyState.answered = false;
  renderStudyCard();
}

function renderStudyComplete() {
  const body = document.getElementById('study-body');
  const due = getDueWords().length;
  body.innerHTML = `
    <div class="study-complete">
      <div class="big-emoji">${studyState.wrong === 0 ? '🎉' : '📚'}</div>
      <h3>${studyState.wrong === 0 ? '완벽해요!' : '오늘 학습 완료!'}</h3>
      <p>틀린 단어들은 내일 다시 복습 예정이에요.<br>꾸준히 하면 확실히 외워져요!</p>
      <div class="study-stat-row">
        <div class="stat-box"><div class="num">${studyState.sessionTotal}</div><div class="lbl">학습 단어</div></div>
        <div class="stat-box"><div class="num" style="color:var(--green)">${studyState.correct}</div><div class="lbl">정답</div></div>
        <div class="stat-box"><div class="num" style="color:var(--red)">${studyState.wrong}</div><div class="lbl">오답</div></div>
        ${due > 0 ? `<div class="stat-box"><div class="num" style="color:var(--yellow)">${due}</div><div class="lbl">남은 복습</div></div>` : ''}
      </div>
      ${due > 0 ? `<button class="study-reveal-btn" onclick="openStudy()">🔄 계속 학습 (${due}개 남음)</button>` : ''}
      <button class="btn-secondary" onclick="closeStudy()" style="width:100%;padding:9px">닫기</button>
    </div>`;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = ()  => new Date().toISOString().split('T')[0];
const esc   = s   => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function showToast(msg, duration=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

//  Init
// ══════════════════════════════════════════════
document.getElementById('ai-badge').classList.add('visible');
if (Object.keys(allVocabulary).length > 0) {
  renderVocabulary();
  setTimeout(() => repairBadKoreanMeanings(25), 600);
}
updateStudyBadge(); // 이전 세션 복습 단어 뱃지 표시
</script>
